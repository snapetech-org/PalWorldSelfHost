# ng-runner-policy: private-jit-only-v1
name: Validate public site

on:
  workflow_dispatch:
    inputs:
      action:
        description: Required manual workflow action
        type: choice
        options: [publish]
        required: true
      runner_pool:
        description: Required private JIT runner pool
        type: choice
        options: [private]
        required: true

permissions:
  contents: read

concurrency:
  group: palworld-public-production
  cancel-in-progress: false

jobs:
  test:
    if: >-
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action == 'publish' &&
          inputs.runner_pool == 'private'
        )
      ) &&
      (
        true
      )
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-palworldselfhost","ng-main-run-{0}","gha-{0}-test"]}}', github.run_id)) }}
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/deploy-public.sh
      - run: test -s public/index.html && test -s public/style.css && test -s public/app.js
